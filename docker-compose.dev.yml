services:
  backend:
    build: ./backend
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/recipes.db
      - SECRET_KEY=dev-secret-key
      - UPLOAD_DIR=/data/uploads
    volumes:
      - ./backend/app:/app/app
      - recipe-data:/data
    ports:
      - "8000:8000"
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  recipe-data:
